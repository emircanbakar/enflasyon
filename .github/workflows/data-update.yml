name: data-update

# Aylık TÜFE verisini EVDS3'ten çeker, doğrular, çapraz kontrol eder ve PR açar
# (docs/web.md, Bölüm 4). TÜİK enflasyonu her ayın 3'ünde 10:00'da açıklar.
on:
  schedule:
    - cron: "0 8 3-5 * *" # 11:00 Europe/Istanbul (UTC+3)
  workflow_dispatch:

permissions: {}

concurrency:
  group: data-update
  cancel-in-progress: false

env:
  LEFTHOOK: 0

jobs:
  update:
    # Kurulum tamamlanana kadar (repo değişkeni DATA_APP_CLIENT_ID yokken) atlanır;
    # böylece zamanlanmış çalışmalar her ay boşuna hata vermez.
    if: vars.DATA_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # Secret'lar yalnızca bu environment'ta; environment sadece main'den çalışacak şekilde kısıtlanır.
    environment: data
    permissions:
      contents: read # yazma işi GitHub App token'ıyla yapılır
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter enflasyon-core build

      # Doğrulama veya çapraz kontrol başarısızsa adım 1 ile çıkar, PR açılmaz.
      - name: Veriyi çek, doğrula ve üret
        run: pnpm --filter web data:update --source evds
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          client-id: ${{ vars.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}

      # GITHUB_TOKEN ile açılan PR'da ci.yml tetiklenmez; bu yüzden App token'ı kullanılır.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          sign-commits: true
          branch: data/auto-update
          delete-branch: true
          add-paths: apps/web/data/*.json
          commit-message: "data: update monthly CPI data"
          title: "data: monthly CPI update"
          body-path: apps/web/.cache/data-report.md
          labels: data
