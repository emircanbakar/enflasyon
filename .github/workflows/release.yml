name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency: release

env:
  LEFTHOOK: 0

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Git tag ve GitHub Release oluşturmak için
      id-token: write # NPM Provenance & Trusted Publishing (OIDC) için
      pull-requests: write # Sürüm PR'ı açmak/güncellemek için
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Paketi derle ve doğrula
        run: |
          pnpm --filter enflasyon-core build
          pnpm --filter enflasyon-core lint:package

      - name: Sürüm PR oluştur veya NPM'e yayınla
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          title: "chore: Sürüm güncellemesi"
          commit: "chore: Sürüm güncellemesi [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
